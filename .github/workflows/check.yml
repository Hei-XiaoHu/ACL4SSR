name: 配置一致性与内核校验

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyyaml

      - name: spec 自检 + 生成文件必须与 src/spec.yaml 一致
        run: python3 tools/build.py --check

      - uses: ./.github/actions/setup-mihomo

      - name: mihomo -t 校验（Xboard / subconverter / 国外覆写）
        run: python3 tools/check.py ./mihomo

      - name: QQ / Claude / DNS / 广告分流行为回归（本地夹具）
        run: python3 tools/check_routing.py ./mihomo

      - name: 当日上游核对（Claude 不在 cn、本地条目未被前面的集合截走）
        run: cd tools && python3 check_upstream.py
