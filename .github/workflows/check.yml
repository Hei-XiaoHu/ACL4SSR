name: 配置一致性与内核校验

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install pyyaml

      - uses: ./.github/actions/setup-mihomo

      # 与本地推送前的 python3 tools/verify.py 完全相同：spec 自检、内核校验、分流/DNS 回归、
      # 当日上游核对、试构建规则集（含骤减保护）、真实规则集关键域名
      - name: 全部校验（tools/verify.py）
        run: python3 tools/verify.py --mihomo ./mihomo
