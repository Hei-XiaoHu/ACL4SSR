# Xboard 订阅模板 - Stash（iOS / macOS）（custom.stash.yaml）
# 本文件由 tools/build.py 从 src/spec.yaml 生成，请勿手改；改规则请改 src/spec.yaml
# 策略组内 /正则/i 为 Xboard 侧节点筛选；/^$/ 表示不追加任何节点
# 规则：MetaCubeX/meta-rules-dat 的 yaml 版（Stash 不支持 mrs）；国内域名用 ACL4SSR ChinaDomain + GEOIP,CN
#   （geosite:cn 文本版 11 万行，iOS 网络扩展约 50MB 内存上限装不下）
# 去广告：AWAvenue 秋风规则（约 900 条，含广告+隐私跟踪+流氓推广）
# DNS：follow-rule + 规则把 DoH IP 指向 🛰️ DNS-Proxy，等价 mihomo 的 nameserver#组；nameserver-policy 的 geosite 需 Stash iOS 3.4.0+
# 规则 CDN 为 https://testingcf.jsdelivr.net/gh，失效时全局替换为 https://fastly.jsdelivr.net/gh

mode: rule
log-level: warning
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.ntp.org
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  follow-rule: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  nameserver-policy:
    geosite:cn:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

# 节点由 Xboard 注入
proxies: []

