# Xboard 订阅模板 - Stash（iOS / macOS）（custom.stash.yaml）
# 本文件由 tools/build.py 从 src/spec.yaml 生成，请勿手改；改规则请改 src/spec.yaml
# 策略组内 /正则/i 为 Xboard 侧节点筛选；/^$/ 表示不追加任何节点
# 规则：MetaCubeX/meta-rules-dat 的 domain/ipcidr yaml；国内外兜底复用 Stash 原生 GEOSITE + GEOIP,CN
#   （与 geosite DNS policy 顺序对齐，不额外下载全量 cn/geolocation-!cn 文本）
# 去广告：AWAvenue 秋风规则（约 900 条，含广告+隐私跟踪+流氓推广）
# DNS：follow-rule + DoH 端点 IP 绑定 🛰️ DNS；内网系统 DNS，已知国内与游戏下载走国内 DoH，其余境外 DoH
# geosite DNS policy 需 Stash iOS 3.4.0+；GEOSITE 数据首次从 GitHub 按需加载，请确保 GitHub 可达
# 规则 CDN 为 https://testingcf.jsdelivr.net/gh，失效时全局替换为 https://fastly.jsdelivr.net/gh

mode: rule
log-level: warning
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  follow-rule: true
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localdomain
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.ts.net
  - +.tplinkwifi.net
  - +.tendawifi.com
  - +.router.ctc
  - asusrouter.com
  - router.asus.com
  - routerlogin.com
  - tplogin.cn
  - miwifi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - '*.n.n.srv.nintendo.net'
  - +.stun.playstation.net
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  nameserver-policy:
    +.lan:
    - system
    +.local:
    - system
    +.localdomain:
    - system
    +.localhost:
    - system
    +.home.arpa:
    - system
    +.internal:
    - system
    +.ts.net:
    - system
    +.tplinkwifi.net:
    - system
    +.tendawifi.com:
    - system
    +.router.ctc:
    - system
    asusrouter.com:
    - system
    router.asus.com:
    - system
    routerlogin.com:
    - system
    tplogin.cn:
    - system
    miwifi.com:
    - system
    localhost.ptlogin2.qq.com:
    - system
    localhost.sec.qq.com:
    - system
    localhost.work.weixin.qq.com:
    - system
    geosite:private:
    - system
    geosite:category-game-platforms-download:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    +.steamcontent.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    +.steamusercontent.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    +.steamchina.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    +.wmsjsteam.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    +.st.dl.pinyuncloud.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    dl.steam.ksyna.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    steampipe.steamcontent.tnkjmec.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    +.cdn.ea.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    download.dm.origin.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    cdn.gog.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    cdn-hw.gog.com:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    geosite:cn:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

# 节点由 Xboard 注入
proxies: []

proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - /^(?!.*(剩余|到期|过期|官网|套餐|流量|重置|倍率)).*/i
  - DIRECT
  - REJECT
- name: ♻️ 自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 600
  tolerance: 50
  lazy: true
  proxies:
  - /^(?!.*(剩余|到期|过期|官网|套餐|流量|重置|倍率)).*/i
  - REJECT
