# Xboard 订阅模板 - Stash（iOS / macOS）（custom.stash.yaml）
# 本文件由 tools/build.py 从 src/spec.yaml 生成，请勿手改；改规则请改 src/spec.yaml
# 策略组内 /正则/i 为 Xboard 侧节点筛选；/^$/ 表示不追加任何节点
# 规则：MetaCubeX/meta-rules-dat 的 domain/ipcidr yaml；国内外兜底复用 Stash 原生 GEOSITE + GEOIP,CN
#   （与 geosite DNS policy 顺序对齐，不额外下载全量 cn/geolocation-!cn 文本）
# 去广告：AWAvenue 秋风规则（约 900 条，含广告+隐私跟踪+流氓推广）
# DNS：follow-rule + DoH 端点 IP 绑定 🛰️ DNS-Proxy；内网系统 DNS、国外优先境外 DoH；geosite policy 需 Stash iOS 3.4.0+
# GEOSITE 数据首次从 GitHub 按需加载，请确保 GitHub 可达；少量国内属性标签已展开为 DNS 字面域名
# 规则 CDN 为 https://testingcf.jsdelivr.net/gh，失效时全局替换为 https://fastly.jsdelivr.net/gh

mode: rule
log-level: warning
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  follow-rule: true
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localdomain
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.ts.net
  - +.tplinkwifi.net
  - +.tendawifi.com
  - +.router.ctc
  - asusrouter.com
  - router.asus.com
  - routerlogin.com
  - tplogin.cn
  - miwifi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - '*.n.n.srv.nintendo.net'
  - +.stun.playstation.net
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  nameserver-policy:
    +.lan:
    - system
    +.local:
    - system
    +.localdomain:
    - system
    +.localhost:
    - system
    +.home.arpa:
    - system
    +.internal:
    - system
    +.ts.net:
    - system
    +.tplinkwifi.net:
    - system
    +.tendawifi.com:
    - system
    +.router.ctc:
    - system
    asusrouter.com:
    - system
    router.asus.com:
    - system
    routerlogin.com:
    - system
    tplogin.cn:
    - system
    miwifi.com:
    - system
    localhost.ptlogin2.qq.com:
    - system
    localhost.sec.qq.com:
    - system
    localhost.work.weixin.qq.com:
    - system
    geosite:private:
    - system
