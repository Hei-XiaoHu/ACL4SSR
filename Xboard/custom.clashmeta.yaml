# Xboard 订阅模板 - Clash Meta / mihomo（Clash Party、CMFA 等）（custom.clashmeta.yaml）
# 本文件由 tools/build.py 从 src/spec.yaml 生成，请勿手改；改规则请改 src/spec.yaml
# 策略组内 /正则/i 为 Xboard 侧节点筛选；/^$/ 表示不追加任何节点
# 规则：MetaCubeX/meta-rules-dat（v2fly 社区，每日同步）mrs 二进制规则集，匹配快、内存小
# 去广告：AdRules + anti-AD（mrs）；默认走代理的境外 UDP443 回落 TCP，默认直连/国内/游戏/下载/未知 IP 保留
# DNS：AI/代理补充/已知国外域名优先走境外 DoH；国内用国内 DoH，内网用系统 DNS
# 安全：allow-lan 关闭，DNS 仅监听 127.0.0.1；find-process-mode off（无进程规则，省 CPU）
# 规则 CDN 为 https://testingcf.jsdelivr.net/gh，失效时全局替换为 https://fastly.jsdelivr.net/gh

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: warning
find-process-mode: 'off'
tcp-concurrent: true
unified-delay: true
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true

# 嗅探：浏览器自带 DoH 或直接按 IP 连接时，从 TLS/QUIC/HTTP 握手中取回域名再分流
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.push.apple.com
  - Mijia Cloud

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  direct-nameserver-follow-policy: true
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localdomain
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.ts.net
  - +.tplinkwifi.net
  - +.tendawifi.com
  - +.router.ctc
  - asusrouter.com
  - router.asus.com
  - routerlogin.com
  - tplogin.cn
  - miwifi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - '*.n.n.srv.nintendo.net'
  - +.stun.playstation.net
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#🛰️ DNS-Proxy
  - https://8.8.8.8/dns-query#🛰️ DNS-Proxy
  proxy-server-nameserver: &id001
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  direct-nameserver: *id001
  nameserver-policy:
    rule-set:private:
    - system
    +.lan:
    - system
    +.local:
    - system
    +.localdomain:
    - system
    +.localhost:
    - system
    +.home.arpa:
    - system
    +.internal:
    - system
    +.ts.net:
    - system
    +.tplinkwifi.net:
    - system
    +.tendawifi.com:
    - system
    +.router.ctc:
    - system
    asusrouter.com:
    - system
    router.asus.com:
    - system
    routerlogin.com:
    - system
    tplogin.cn:
    - system
    miwifi.com:
    - system
    localhost.ptlogin2.qq.com:
    - system
    localhost.sec.qq.com:
    - system
    localhost.work.weixin.qq.com:
    - system
    rule-set:claude: &id002
    - https://1.1.1.1/dns-query#🛰️ DNS-Proxy
    - https://8.8.8.8/dns-query#🛰️ DNS-Proxy
    rule-set:shared-auth: *id002
    rule-set:extra-ai: *id002
    rule-set:extra-proxy: *id002
    rule-set:games-cn: *id001
    rule-set:game-download-cn: *id001
    rule-set:game-download: *id001
    rule-set:entertainment-cn: *id001
    rule-set:entertainment-cn-attr: *id001
    rule-set:ai: *id002
    rule-set:games: *id002
    rule-set:proxymedia: *id002
    rule-set:gfw: *id002
    rule-set:geolocation-!cn: *id002
    rule-set:cn: *id001

