# Xboard 订阅模板 - Clash Meta / mihomo（custom.clashmeta.yaml）
# 与 Hei-XiaoHu/ACL4SSR 的 Full_AdblockPlus + dns_enhanced.yml 同一套规则方案
# 节点由 Xboard 注入 proxies；策略组内 /正则/i 为节点筛选，无正则的组自动追加全部节点
# 去广告：AdRules(EasyList 系 18万+域名) + anti-AD(国内 10万+域名)，domain 前缀树，内存友好
port: 7890
socks-port: 7891
bind-address: '*'
allow-lan: true
mode: rule
tcp-concurrent: true
unified-delay: true
log-level: info
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: false
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.msftconnecttest.com
  - +.msftncsi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  default-nameserver:
  - 223.5.5.5
  - 1.2.4.8
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#🛰️ DNS-Proxy
  - https://8.8.8.8/dns-query#🛰️ DNS-Proxy
  - https://9.9.9.9/dns-query#🛰️ DNS-Proxy
  - https://208.67.222.222/dns-query#🛰️ DNS-Proxy
  - https://77.88.8.8/dns-query#🛰️ DNS-Proxy
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  nameserver-policy:
    geosite:cn:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
proxies: []
proxy-groups:
- name: 🎓 上网走 🚀 节点选择 · AI走 💬 Ai平台
