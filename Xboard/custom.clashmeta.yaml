# Xboard 订阅模板 - Clash Meta / mihomo（Clash Party、CMFA 等）（custom.clashmeta.yaml）
# 本文件由 tools/build.py 从 src/spec.yaml 生成，请勿手改；改规则请改 src/spec.yaml
# 策略组内 /正则/i 为 Xboard 侧节点筛选；/^$/ 表示不追加任何节点
# 规则：MetaCubeX/meta-rules-dat（v2fly 社区，每日同步）mrs 二进制规则集，匹配快、内存小
# 去广告：AdRules + anti-AD（mrs）；QUIC 走代理时拒绝，自动回落 TCP
# DNS：国外域名经 🛰️ DNS-Proxy 组走 1.1.1.1 / 8.8.8.8 DoH；国内域名与节点域名用国内 DoH
# 安全：allow-lan 关闭，DNS 仅监听 127.0.0.1；find-process-mode off（无进程规则，省 CPU）
# 规则 CDN 为 https://testingcf.jsdelivr.net/gh，失效时全局替换为 https://fastly.jsdelivr.net/gh

port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: warning
find-process-mode: 'off'
tcp-concurrent: true
unified-delay: true
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: false

# 嗅探：浏览器自带 DoH 或直接按 IP 连接时，从 TLS/QUIC/HTTP 握手中取回域名再分流
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - +.push.apple.com
  - Mijia Cloud

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.stun.*.*
  - +.stun.*.*.*
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#🛰️ DNS-Proxy
  - https://8.8.8.8/dns-query#🛰️ DNS-Proxy
  proxy-server-nameserver: &id001
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  direct-nameserver: *id001
  direct-nameserver-follow-policy: false
  nameserver-policy:
    rule-set:private:
    - system
    rule-set:cn: *id001

# 节点由 Xboard 注入
proxies: []

