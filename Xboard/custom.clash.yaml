# Xboard 订阅模板 - Clash 原版/Premium 内核（custom.clash.yaml，CFW/ClashX/CFA 旧核）
# 旧核 rule-provider 仅支持 YAML payload（无 format:text），故分流列表改用 blackmatrix7 同类 YAML 规则
# 与 Meta/Stash 版的差异：无 DNS 走节点(🛰️组)、无 EasyList 级 AdBlock(🆎组保留但无规则)、
#   GoogleCN/UnBan 由 China 列表近似覆盖；DNS 采用 fallback+geoip 防污染
port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.msftconnecttest.com
  - +.msftncsi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
proxies: []
proxy-groups:
- name: 🎓 上网走 🚀 节点选择 · AI走 💬 Ai平台
