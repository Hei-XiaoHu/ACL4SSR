# ============================================================================
# 配置与规则源头
#   python3 tools/build.py         生成下面七份配置（请勿手改，CI 会校验一致性）
#   python3 tools/build_rules.py   合并本地 rules/*.txt 与上游列表 → rules 分支（Action 每日 04:00 自动跑）
# 生成：
#   Clash/config/ACL4SSR_Online_Full_AdblockPlus.ini          subconverter · mihomo
#   Clash/config/ACL4SSR_Online_Full_AdblockPlus_Stash.ini    subconverter · Stash
#   Clash/customBaseConfigs/dns_enhanced.yml                  上面 ini 的底包 · mihomo
#   Clash/customBaseConfigs/dns_enhanced_stash.yml            上面 ini 的底包 · Stash
#   Xboard/custom.clashmeta.yaml                              Xboard 模板 · mihomo（电脑 Clash Party / 安卓 CMFA）
#   Xboard/custom.stash.yaml                                  Xboard 模板 · Stash（iOS）
#   Clash/override/overseas.yaml                              Clash Party 远程覆写 · 国外模式
# ============================================================================

# 合并后的规则集发布在本仓库 rules 分支，经 jsDelivr 下载。
# 分支地址在 jsDelivr 各层最多缓存约 12 小时，purge 清不干净，规则改动最长约 12 小时后到客户端。
# fastly 失效时可换 https://cdn.jsdelivr.net/gh 或 https://testingcf.jsdelivr.net/gh
cdn: https://fastly.jsdelivr.net/gh
repo: Hei-XiaoHu/ACL4SSR
rules_branch: rules
provider_interval: 86400

test_url: https://cp.cloudflare.com/generate_204
test_interval: 600            # 秒；Xboard 显式 lazy，INI 依赖转换器/客户端默认值

# 非规则配置也在这里统一维护；两种客户端仅写入各自支持的字段。
clients:
  meta:
    general:
      port: 7890
      socks-port: 7891
      allow-lan: false
      mode: rule
      log-level: warning
      # 无进程分流规则，开启仅为在连接列表里显示应用名；开销很小。客户端自身设置可覆盖
      find-process-mode: always
      tcp-concurrent: true
      unified-delay: true
      external-controller: 127.0.0.1:9090
      profile: {store-selected: true, store-fake-ip: true}
    sniffer:
      enable: true
      force-dns-mapping: true
      parse-pure-ip: true
      override-destination: false
      sniff:
        HTTP: {ports: [80, "8080-8880"]}
        TLS: {ports: [443, 8443]}
        QUIC: {ports: [443, 8443]}
      skip-domain: [+.push.apple.com, Mijia Cloud]
    dns:
      enable: true
      listen: 127.0.0.1:1053
      ipv6: false
      prefer-h3: false
      respect-rules: true
      use-hosts: true
      use-system-hosts: true
      cache-algorithm: arc
      enhanced-mode: fake-ip
      fake-ip-range: 198.18.0.1/16
      fake-ip-filter-mode: blacklist
      direct-nameserver-follow-policy: true
  stash:
    general:
      mode: rule
      log-level: warning
      ipv6: false
      profile: {store-selected: true, store-fake-ip: true}
    dns:
      enable: true
      ipv6: false
      enhanced-mode: fake-ip
      fake-ip-range: 198.18.0.1/16
      follow-rule: true

# 节点名包含这些词的不参与任何分组（机场信息节点 / 高倍率节点）
node_exclude: 剩余|到期|过期|官网|套餐|流量|重置|倍率

# 策略组（面板显示顺序 = 下面的顺序，常用的在上）。$nodes = 全部节点（已排除 node_exclude）
# 不设地区组：节点固定手选，地区组从未使用。
dns_group: 🛰️ DNS
lists:
  proxy_first: &P [🚀 节点选择, ♻️ 自动选择, $nodes, DIRECT, REJECT]
  direct_first: &D [DIRECT, 🚀 节点选择, ♻️ 自动选择, $nodes, REJECT]

groups:
  - {name: 🚀 节点选择, proxies: [♻️ 自动选择, $nodes, DIRECT, REJECT]}
  - {name: ♻️ 自动选择, type: url-test, proxies: [$nodes, REJECT], tolerance: 50}
  - {name: 🤖 AI, proxies: *P}              # Claude / OpenAI / Gemini 等，手选支持地区的节点
  - {name: 🎬 流媒体, proxies: *P}          # YouTube / Netflix / 巴哈姆特 / 其他境外娱乐
  - {name: 📺 B站, proxies: *D}             # 默认直连；看港澳台番剧时切到港台节点
  - {name: 🎮 游戏, proxies: *P}            # 游戏平台商店/登录/社区/Steam CM；下载 CDN 走直连
  - {name: 🔍 谷歌, proxies: *P}            # 谷歌服务 + FCM 推送
  - {name: Ⓜ️ 微软, proxies: *D}            # Bing / OneDrive / 微软服务
  - {name: 🍎 苹果, proxies: *D}
  - {name: 🎯 直连, proxies: *D}            # 国内、游戏下载、网易云等
  - {name: 🐟 漏网之鱼, proxies: *P}        # 只接所有规则都未命中、IP 也不在国内的流量
  - {name: 🛰️ DNS, proxies: *P}             # 境外 DoH 的出口
  - {name: 🛑 广告, proxies: [REJECT, DIRECT]}

# 规则集与分流顺序（自上而下匹配，顺序即规则顺序）。
#   每个集合 = rules/<name>.txt（若存在）+ from 中的上游，构建时合并去重，发布为 <name>.mrs / <name>.yaml。
#   from 简写：geosite:X / geoip:X = MetaCubeX/meta-rules-dat；其他名字见下面 upstream。
#   from 可写成 {meta: [...], stash: [...]} 为两个客户端分别指定来源。
#   type: domain（默认）/ ip / classical（仅 local-direct，含正则）
#   no_resolve: IP 集合不为匹配而额外解析域名
#   to 省略：只供 QUIC 豁免引用，不生成分流规则
#   - quic 标记定向 QUIC 拒绝规则的位置；最后一条 match 为兜底
upstream:
  adrules: {url: 'https://raw.githubusercontent.com/Cats-Team/AdRules/main/adrules_domainset.txt'}
  anti-ad: {url: 'https://anti-ad.net/domains.txt', plain: suffix}   # 纯域名按后缀生效
  awavenue: {url: 'https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.yaml'}

# Stash 直接使用原生 GEOSITE/GEOIP 的来源（不下载对应的大列表）
stash_native:
  geosite:geolocation-!cn: GEOSITE,geolocation-!cn
  geosite:cn: GEOSITE,cn
  geoip:cn: GEOIP,CN

sets:
  - {name: local-direct, to: 🎯 直连, type: classical}
  - {name: private, to: DIRECT, from: [geosite:private]}
  - {name: private-ip, to: DIRECT, type: ip, from: [geoip:private], no_resolve: true}
  - {name: telemetry, to: 🛑 广告}
  # 默认走代理的境外 QUIC；默认直连的服务、国内、游戏、下载、通信、自定义豁免和未知 IP 不拦
  - quic
  # 只给明确的功能端点必要例外，不能把整个 Claude / AI 家族放到广告规则前
  - {name: ai-essential, to: 🤖 AI}
  # 验证码服务被很多网站共用，走通用节点（低延迟）而非 AI 出口
  - {name: auth, to: 🚀 节点选择}
  # mihomo 用 AdRules + anti-AD（两者有独有规则）；iOS 用轻量 AWAvenue
  - {name: ads, to: 🛑 广告, from: {meta: [adrules, anti-ad], stash: [awavenue]}}
  # AI 放在微软/谷歌之前，否则 copilot.microsoft.com 等会被微软组截走
  - {name: ai, to: 🤖 AI, from: ['geosite:category-ai-!cn']}
  # 已核实的 Anthropic 自有网段兜底；不把共享 Cloudflare/CDN IP 全部送进 AI
  - {name: ai-ip, to: 🤖 AI, type: ip, no_resolve: true}
  # Steam CM 信令走游戏：上游 games@cn 含 steamserver.net，必须先于 direct
  - {name: game-proxy, to: 🎮 游戏}
  # B 站先于国内娱乐集合，切到港台节点时整站跟随
  - {name: bilibili, to: 📺 B站, from: [geosite:bilibili]}
  # 苹果先于 direct：category-entertainment@cn 收录了 Apple Music / iTunes
  - {name: apple, to: 🍎 苹果, from: [geosite:apple]}
  # 大流量下载与国内服务：先于游戏平台、微软等，保证下载 CDN 直连
  - name: direct
    to: 🎯 直连
    from: ['geosite:category-games@cn', 'geosite:category-game-platforms-download', geosite:netease,
           geosite:category-entertainment-cn, 'geosite:category-entertainment@cn']
  # geosite:microsoft 含 GitHub，而微软组默认直连；GitHub 在国内直连很慢，先行截走
  - {name: proxy, to: 🚀 节点选择, from: [geosite:github, geosite:telegram]}
  - {name: proxy-ip, to: 🚀 节点选择, type: ip, from: [geoip:telegram], no_resolve: true}
  - {name: microsoft, to: Ⓜ️ 微软, from: [geosite:bing, geosite:onedrive, geosite:microsoft]}
  # 游戏平台先于流媒体：category-entertainment 收录了大量 Steam/EA/任天堂域名
  - {name: games, to: 🎮 游戏, from: [geosite:epicgames, geosite:ea, geosite:sony, geosite:steam, geosite:nintendo, 'geosite:category-games-!cn']}
  # YouTube 先于谷歌集合（googlevideo 也在 geosite:google 中）
  - {name: media, to: 🎬 流媒体, from: [geosite:youtube, geosite:netflix, geosite:bahamut, geosite:category-entertainment]}
  - {name: media-ip, to: 🎬 流媒体, type: ip, from: [geoip:netflix], no_resolve: true}
  - {name: google, to: 🔍 谷歌, from: [geosite:googlefcm, geosite:google-cn, geosite:google]}
  # 已知国外域名直接走节点选择（🐟 只留给真正未命中的流量），免去下面 IP 规则触发的 DNS 解析。
  # 必须在 cn 之前：MetaCubeX 的 cn 合并了 felixonmars dnsmasq-china-list（“国内 DNS 解析更优”的域名），
  # 含 browserleaks.com、acm.org、cambridge.org 等约 150 个国外站，放后面会被 cn 截走直连
  - {name: foreign, to: 🚀 节点选择, from: [geosite:gfw, 'geosite:geolocation-!cn']}
  - {name: cn, to: 🎯 直连, from: [geosite:cn], no_resolve: true}
  # 需要解析域名得到 IP，放在最后，只有前面都没命中的域名才会解析
  - {name: cn-ip, to: 🎯 直连, type: ip, from: [geoip:cn]}
  - {name: quic-exempt, from: [geosite:category-communication, geosite:google-cn]}
  - {match: 🐟 漏网之鱼}

# 国外模式（Clash Party 远程覆写，仅海外电脑）：分流规则与策略组完全不变，
# 只把 DNS 中所有国内服务器换成 Cloudflare / Google 的 DoH + DoT；内网仍走 system。
overseas:
  dns_bootstrap: [1.1.1.1, 8.8.8.8]
  dns: [https://1.1.1.1/dns-query, https://8.8.8.8/dns-query, tls://1.1.1.1, tls://8.8.8.8]

# 每周报告关注的上游集合：列出相比上周的增删（下载集合删掉仍在用的主机时需要补进 rules/direct.txt）
watch: ['geosite:category-game-platforms-download', 'geosite:category-ai-!cn']

# 定向 QUIC 拒绝：已识别境外域名与明确自有 IP 让 UDP443 回落 TCP，不把未知 IP 当境外。
# 已有国内真实 IP 豁免；cn/!cn 域名交集采用明确境外归属优先。
quic_reject: [ai, auth, proxy, media, foreign]
quic_reject_ip: [ai-ip]
# 豁免：自定义列表与通信语音、google-cn；默认直连的服务；游戏与下载（UDP443 也可能是游戏/语音协议）。
# 只按默认分组判断；手动切换策略组后规则无法感知。
quic_exempt: [quic-exempt, direct, bilibili, microsoft, apple, games, game-proxy]

# DNS 模型：已知国内 → 国内 DoH；其余 → 经 🛰️ DNS 查境外 DoH；内网 → system。
# fake-ip / 系统代理下，走代理的连接把域名交给节点远端解析，本地不查询；
# 本地解析只发生在：IP 规则（cn-ip）、DIRECT 出站、fake-ip-filter、节点域名。
# mihomo：DIRECT 出站使用 direct-nameserver（国内）；follow-policy 只为让内网名仍走 system，
#         policy 中不放任何“境外”条目，DIRECT 未命中 policy 时一律回到国内 direct-nameserver。
# Stash：没有 direct-nameserver，DIRECT 也用主 DNS，所以额外给“默认直连但不在 cn 里”的
#        游戏下载集合指定国内 DNS（下载 CDN 需要就近节点）。geosite policy 需 iOS 3.4.0+。
stash_dns_china: ['geosite:category-game-platforms-download', direct]   # direct = rules/direct.txt 的条目
dns_system_domains:
  - +.lan
  - +.local
  - +.localdomain
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.ts.net
  - +.tplinkwifi.net
  - +.tendawifi.com
  - +.router.ctc
  - asusrouter.com
  - router.asus.com
  - routerlogin.com
  - tplogin.cn
  - miwifi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com

fake_ip_filter:
  - +.lan
  - +.local
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - "*.n.n.srv.nintendo.net"
  - +.stun.playstation.net
  - "xbox.*.*.microsoft.com"
  - "*.*.xboxlive.com"
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com

# 国外 DoH（经 🛰️ DNS 组发出）与国内 DoH
dns_remote: [https://1.1.1.1/dns-query, https://8.8.8.8/dns-query]
dns_china: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
dns_bootstrap: [223.5.5.5, 119.29.29.29]
