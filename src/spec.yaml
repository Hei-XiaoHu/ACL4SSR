# ============================================================================
# 配置与规则源头 —— 改完运行：python3 tools/build.py
# 生成（请勿手改，CI 会校验一致性）：
#   Clash/config/ACL4SSR_Online_Full_AdblockPlus.ini          subconverter · mihomo
#   Clash/config/ACL4SSR_Online_Full_AdblockPlus_Stash.ini    subconverter · Stash
#   Clash/customBaseConfigs/dns_enhanced.yml                  上面 ini 的底包 · mihomo
#   Clash/customBaseConfigs/dns_enhanced_stash.yml            上面 ini 的底包 · Stash
#   Xboard/custom.clashmeta.yaml                              Xboard 模板 · mihomo（电脑 Clash Party / 安卓 CMFA）
#   Xboard/custom.stash.yaml                                  Xboard 模板 · Stash（iOS）
#   Clash/override/overseas.yaml                              Clash Party 远程覆写 · 国外模式
# ============================================================================

# 规则下载 CDN（jsDelivr 失效时可换 https://fastly.jsdelivr.net/gh 或 https://cdn.jsdelivr.net/gh）
cdn: https://testingcf.jsdelivr.net/gh
self_repo: Hei-XiaoHu/ACL4SSR@master
provider_interval: 86400

test_url: https://cp.cloudflare.com/generate_204
test_interval: 600            # 秒；Xboard 显式 lazy，INI 依赖转换器/客户端默认值

# 非规则配置也在这里统一维护；两种客户端仅写入各自支持的字段。
clients:
  meta:
    general:
      port: 7890
      socks-port: 7891
      allow-lan: false
      mode: rule
      log-level: warning
      # 无进程分流规则，开启仅为在连接列表里显示应用名；开销很小。客户端自身设置可覆盖
      find-process-mode: always
      tcp-concurrent: true
      unified-delay: true
      external-controller: 127.0.0.1:9090
      profile: {store-selected: true, store-fake-ip: true}
    sniffer:
      enable: true
      force-dns-mapping: true
      parse-pure-ip: true
      override-destination: false
      sniff:
        HTTP: {ports: [80, "8080-8880"]}
        TLS: {ports: [443, 8443]}
        QUIC: {ports: [443, 8443]}
      skip-domain: [+.push.apple.com, Mijia Cloud]
    dns:
      enable: true
      listen: 127.0.0.1:1053
      ipv6: false
      prefer-h3: false
      respect-rules: true
      use-hosts: true
      use-system-hosts: true
      cache-algorithm: arc
      enhanced-mode: fake-ip
      fake-ip-range: 198.18.0.1/16
      fake-ip-filter-mode: blacklist
      direct-nameserver-follow-policy: true
  stash:
    general:
      mode: rule
      log-level: warning
      ipv6: false
      profile: {store-selected: true, store-fake-ip: true}
    dns:
      enable: true
      ipv6: false
      enhanced-mode: fake-ip
      fake-ip-range: 198.18.0.1/16
      follow-rule: true

# 节点名包含这些词的不参与任何分组（机场信息节点 / 高倍率节点）
node_exclude: 剩余|到期|过期|官网|套餐|流量|重置|倍率

# 策略组（面板显示顺序 = 下面的顺序，常用的在上）。$nodes = 全部节点（已排除 node_exclude）
# 不设地区组：节点固定手选，地区组从未使用。
dns_group: 🛰️ DNS
lists:
  proxy_first: &P [🚀 节点选择, ♻️ 自动选择, $nodes, DIRECT, REJECT]
  direct_first: &D [DIRECT, 🚀 节点选择, ♻️ 自动选择, $nodes, REJECT]

groups:
  - {name: 🚀 节点选择, proxies: [♻️ 自动选择, $nodes, DIRECT, REJECT]}
  - {name: ♻️ 自动选择, type: url-test, proxies: [$nodes, REJECT], tolerance: 50}
  - {name: 🤖 AI, proxies: *P}              # Claude / OpenAI / Gemini 等，手选支持地区的节点
  - {name: 🎬 流媒体, proxies: *P}          # YouTube / Netflix / 巴哈姆特 / 其他境外娱乐
  - {name: 📺 B站, proxies: *D}             # 默认直连；看港澳台番剧时切到港台节点
  - {name: 🎮 游戏, proxies: *P}            # 游戏平台商店/登录/社区/Steam CM；下载 CDN 走直连
  - {name: 🔍 谷歌, proxies: *P}            # 谷歌服务 + FCM 推送
  - {name: Ⓜ️ 微软, proxies: *D}            # Bing / OneDrive / 微软服务
  - {name: 🍎 苹果, proxies: *D}
  - {name: 🎯 直连, proxies: *D}            # 国内、游戏下载、网易云等
  - {name: 🐟 漏网之鱼, proxies: *P}        # 只接所有规则都未命中、IP 也不在国内的流量
  - {name: 🛰️ DNS, proxies: *P}             # 境外 DoH 的出口
  - {name: 🛑 广告, proxies: [REJECT, DIRECT]}

# 规则集。简写：
#   geosite: X / geoip: X   MetaCubeX/meta-rules-dat（mihomo 用 mrs，Stash 用 yaml）
#   acl: 路径               ACL4SSR/ACL4SSR 的 classical 文本
#   self: 路径              本仓库的 classical yaml
#   meta: / stash:          仅对该客户端生效，或为该客户端单独指定来源
providers:
  extra-direct: {self: Clash/rule/extra-direct.txt}
  extra-ai: {self: Clash/rule/extra-ai.txt}
  extra-proxy: {self: Clash/rule/extra-proxy.txt}
  claude: {self: Clash/rule/claude.txt, behavior: domain}
  claude-essential: {self: Clash/rule/claude-essential.txt, behavior: domain}
  claude-telemetry: {self: Clash/rule/claude-telemetry.txt, behavior: domain}
  claude-ip: {self: Clash/rule/claude-ip.txt, behavior: ipcidr}
  shared-auth: {self: Clash/rule/shared-auth.txt, behavior: domain}
  quic-exempt: {self: Clash/rule/quic-exempt.txt, behavior: domain}
  private: {geosite: private}
  private-ip: {geoip: private}
  functional-direct: {self: Clash/rule/functional-direct.txt, behavior: domain}
  adrules:
    meta: {behavior: domain, format: mrs, url: '{cdn}/Cats-Team/AdRules@main/adrules-mihomo.mrs'}
  anti-ad:
    meta: {behavior: domain, format: mrs, url: https://anti-ad.net/mihomo.mrs}
  awavenue:   # 移动端用轻量集合；不能仅凭文本条数断言实际峰值内存
    stash: {behavior: domain, format: yaml, url: '{cdn}/TG-Twilight/AWAvenue-Ads-Rule@main/Filters/AWAvenue-Ads-Rule-Clash.yaml'}
  ai: {geosite: category-ai-!cn}
  googlefcm: {geosite: googlefcm}
  google-cn: {geosite: google-cn}
  google: {geosite: google}
  # Steam CM 长连接（登录/好友/库同步信令）流量小，跟随 🎮 游戏；上游 games@cn 含 steamserver.net，需提前截走
  game-proxy-extra: {self: Clash/rule/game-proxy-extra.txt, behavior: domain}
  games-cn: {geosite: category-games@cn}   # 含原 steam@cn 全部条目与国内主机/游戏平台
  game-download-cn: {geosite: category-game-platforms-download@cn}
  game-download: {geosite: category-game-platforms-download}
  # 上游下载集合只逐个列主机名；补 Steam 整个内容 CDN、EA/GOG 下载 CDN 与旧 SteamCN 直连条目
  game-download-extra: {self: Clash/rule/game-download-extra.txt, behavior: domain}
  github: {geosite: github}
  bing: {geosite: bing}
  onedrive: {geosite: onedrive}
  microsoft: {geosite: microsoft}
  apple: {geosite: apple}
  telegram: {geosite: telegram}
  communication: {geosite: category-communication}
  telegram-ip: {geoip: telegram}
  netease: {geosite: netease}
  epicgames: {geosite: epicgames}
  ea: {geosite: ea}
  sony: {geosite: sony}
  steam: {geosite: steam}
  nintendo: {geosite: nintendo}
  games: {geosite: category-games-!cn}   # 补齐 Battle.net / Ubisoft / GOG / Riot / Rockstar 等
  youtube: {geosite: youtube}
  netflix: {geosite: netflix}
  netflix-ip: {geoip: netflix}
  bahamut: {geosite: bahamut}
  bilibili: {geosite: bilibili}
  entertainment-cn: {geosite: category-entertainment-cn}
  entertainment-cn-attr: {geosite: category-entertainment@cn}
  # v2fly 明确的境外娱乐分类，避免旧 ProxyMedia 的 anthropic/openai 等宽泛关键词
  proxymedia: {geosite: category-entertainment}
  gfw: {geosite: gfw}
  cn:
    meta: {geosite: cn}
    # Stash 复用原生 GEOSITE,cn；不再下载混有历史 IP 的 ChinaDomain
  geolocation-!cn:
    meta: {geosite: geolocation-!cn}
  cn-ip:
    meta: {geoip: cn}

# 分流规则，自上而下匹配。
#   set: 规则集名（该客户端没有此规则集时自动跳过）  raw: 原样规则
#   no_resolve: 不为此规则额外解析域名；已有真实 IP 的连接仍可匹配
#   only: 仅对该客户端生效
rules:
  - {set: extra-direct, to: 🎯 直连}
  - {set: private, to: DIRECT}
  - {set: private-ip, to: DIRECT, no_resolve: true}
  - {set: functional-direct, to: 🎯 直连}
  - {set: claude-telemetry, to: 🛑 广告}
  # 默认走代理的境外 QUIC；默认直连的服务、国内、游戏、下载、通信、自定义豁免和未知 IP 不拦
  # mihomo 无协议规则，按 UDP443 判断；Stash 用 PROTOCOL,QUIC 只拦真正的 QUIC
  - {quic: true}
  # 只给明确的功能端点必要例外，不能把整个 Claude / AI 家族放到广告规则前
  - {set: claude-essential, to: 🤖 AI}
  # 验证码服务被很多网站共用，走通用节点而非 AI 专用出口
  - {set: shared-auth, to: 🚀 节点选择}
  - {set: adrules, to: 🛑 广告}
  - {set: anti-ad, to: 🛑 广告}
  - {set: awavenue, to: 🛑 广告}
  - {set: claude, to: 🤖 AI}
  - {set: extra-ai, to: 🤖 AI}
  # AI 放在微软/谷歌之前，否则 copilot.microsoft.com 等会被微软组截走
  - {set: ai, to: 🤖 AI}
  # 已核实的 Anthropic 自有网段兜底；不把共享 Cloudflare/CDN IP 全部送进 AI
  - {set: claude-ip, to: 🤖 AI, no_resolve: true}
  - {set: googlefcm, to: 🔍 谷歌}
  # 大流量下载直连在所有游戏代理规则之前；CM 信令走游戏平台，须在 games-cn 之前
  - {set: game-proxy-extra, to: 🎮 游戏}
  - {set: games-cn, to: 🎯 直连}
  - {set: game-download-cn, to: 🎯 直连}
  - {set: game-download, to: 🎯 直连}
  - {set: game-download-extra, to: 🎯 直连}
  # geosite:microsoft 含 GitHub，而微软组默认直连；GitHub 在国内直连很慢，先行截走
  - {set: github, to: 🚀 节点选择}
  # 被墙但默认服务分组走直连的域名补充
  - {set: extra-proxy, to: 🚀 节点选择}
  - {set: bing, to: Ⓜ️ 微软}
  - {set: onedrive, to: Ⓜ️ 微软}
  - {set: microsoft, to: Ⓜ️ 微软}
  - {set: apple, to: 🍎 苹果}
  - {set: telegram, to: 🚀 节点选择}
  - {set: telegram-ip, to: 🚀 节点选择, no_resolve: true}
  - {set: netease, to: 🎯 直连}
  - {set: epicgames, to: 🎮 游戏}
  - {set: ea, to: 🎮 游戏}
  - {set: sony, to: 🎮 游戏}
  - {set: steam, to: 🎮 游戏}
  - {set: nintendo, to: 🎮 游戏}
  - {set: youtube, to: 🎬 流媒体}
  # 专用 AI / FCM / YouTube 策略优先，其他 Google 服务统一到谷歌组
  - {set: google-cn, to: 🔍 谷歌}
  - {set: google, to: 🔍 谷歌}
  - {set: netflix, to: 🎬 流媒体}
  - {set: netflix-ip, to: 🎬 流媒体, no_resolve: true}
  - {set: bahamut, to: 🎬 流媒体}
  - {set: bilibili, to: 📺 B站}
  # 专用策略在前；国内娱乐/国行标签优先于通用境外游戏、娱乐分类
  - {set: entertainment-cn, to: 🎯 直连}
  - {set: entertainment-cn-attr, to: 🎯 直连}
  - {set: games, to: 🎮 游戏}
  - {set: proxymedia, to: 🎬 流媒体}
  - {set: gfw, to: 🚀 节点选择}
  # 已知国外域名直接走 🚀 节点选择（🐟 只留给真正未命中的流量），免去下面 IP 规则触发的 DNS 解析。
  # 必须在 cn 之前：MetaCubeX 的 cn 合并了 felixonmars dnsmasq-china-list（“国内 DNS 解析更优”的域名），
  # 含 browserleaks.com、acm.org、cambridge.org 等约 150 个国外站，放后面会被 cn 截走直连
  - {set: geolocation-!cn, to: 🚀 节点选择}
  - {raw: 'GEOSITE,geolocation-!cn,🚀 节点选择', only: stash}
  - {set: cn, to: 🎯 直连, no_resolve: true}
  - {raw: 'GEOSITE,cn,🎯 直连', only: stash}
  # 以下两条需要解析域名得到 IP，放在最后，只有前面都没命中的域名才会解析
  - {set: cn-ip, to: 🎯 直连}
  - {raw: 'GEOIP,CN,🎯 直连', only: stash}
  - {raw: 'MATCH,🐟 漏网之鱼'}

# 国外模式（Clash Party 远程覆写，仅海外电脑）：分流规则与策略组完全不变，
# 只把 DNS 中所有国内服务器换成 Cloudflare / Google 的 DoH + DoT；内网仍走 system。
overseas:
  dns_bootstrap: [1.1.1.1, 8.8.8.8]
  dns: [https://1.1.1.1/dns-query, https://8.8.8.8/dns-query, tls://1.1.1.1, tls://8.8.8.8]

# 已识别境外域名与明确自有 IP 尝试让 UDP443 回落 TCP，不把未知 IP 当境外。
# 已有国内真实 IP 豁免；cn/!cn 域名交集采用明确境外归属优先。
quic_reject_sets: [claude, extra-ai, ai, youtube, netflix, shared-auth, extra-proxy, proxymedia, gfw, geolocation-!cn]
quic_reject_ip_sets: [claude-ip]
# 豁免：自定义列表、保留 google-cn 的 QUIC 兼容例外；默认直连的服务；
# UDP443 也可能是游戏/语音协议，保护游戏、下载、通信与国内娱乐。
# 只按默认分组判断；手动切换策略组后规则无法感知。
quic_exempt_sets: [quic-exempt, google-cn, bing, onedrive, microsoft, apple, netease, bilibili, games-cn, game-download-cn, game-download, game-download-extra, games, epicgames, ea, sony, steam, nintendo, entertainment-cn, entertainment-cn-attr, communication]

# DNS 模型：已知国内 → 国内 DoH；其余 → 经 🛰️ DNS 查境外 DoH；内网 → system。
# fake-ip / 系统代理下，走代理的连接把域名交给节点远端解析，本地不查询；
# 本地解析只发生在：IP 规则（cn-ip）、DIRECT 出站、fake-ip-filter、节点域名。
# mihomo：DIRECT 出站使用 direct-nameserver（国内）；follow-policy 只为让内网名仍走 system，
#         policy 中不放任何“境外”条目，DIRECT 未命中 policy 时一律回到国内 direct-nameserver。
# Stash：没有 direct-nameserver，DIRECT 也用主 DNS，所以额外给“默认直连但不在 cn 里”的
#        游戏下载集合指定国内 DNS（下载 CDN 需要就近节点）。geosite policy 需 iOS 3.4.0+。
stash_dns_china_sets: [game-download, game-download-extra]
dns_system_domains:
  - +.lan
  - +.local
  - +.localdomain
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.ts.net
  - +.tplinkwifi.net
  - +.tendawifi.com
  - +.router.ctc
  - asusrouter.com
  - router.asus.com
  - routerlogin.com
  - tplogin.cn
  - miwifi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com

fake_ip_filter:
  - +.lan
  - +.local
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - "*.n.n.srv.nintendo.net"
  - +.stun.playstation.net
  - "xbox.*.*.microsoft.com"
  - "*.*.xboxlive.com"
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com

# 国外 DoH（经 🛰️ DNS 组发出）与国内 DoH
dns_remote: [https://1.1.1.1/dns-query, https://8.8.8.8/dns-query]
dns_china: [https://223.5.5.5/dns-query, https://doh.pub/dns-query]
dns_bootstrap: [223.5.5.5, 119.29.29.29]
