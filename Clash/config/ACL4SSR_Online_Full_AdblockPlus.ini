[custom]
;不要随意改变关键字，否则会导致出错
;GitHub 加速前缀 ghfast.top 失效时，全局替换为 https://ghproxy.net/ 或 https://gh-proxy.com/
;acl4SSR规则 - Full_AdblockPlus（mihomo，内存优化）
;全部分流规则已迁移为底包 dns_enhanced.yml 中的 rule-providers（顺序与 ACL4SSR 原版一致）
;去广告：AdRules(同源 EasyList 系, 18万+域名) -> 🆎 AdBlock；anti-AD(国内, 10万+域名) -> 🛡️ 隐私防护
;本 ini 仅提供策略组定义与 GEOIP/FINAL 兕底

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
;全部分流规则已迁移为底包中的 rule-providers（启动解析峰值大降、规则每日自动更新、更新订阅更快）
;此处仅保留无法用 rule-provider 表达的两条兜底规则
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL
