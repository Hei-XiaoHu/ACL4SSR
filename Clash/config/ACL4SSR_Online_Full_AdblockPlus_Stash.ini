[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则 - Full_AdblockPlus（Stash / iOS 版）
;与 mihomo 版 ACL4SSR_Online_Full_AdblockPlus.ini 功能对齐，区别仅在底包：
;  底包换为 dns_enhanced_stash.yml（Stash 内核不支持 mihomo 专属字段，见其注释）
;全部分流规则已迁移为底包 dns_enhanced_stash.yml 中的 rule-providers（顺序与 ACL4SSR 原版一致）
;去广告：AWAvenue 秋风广告规则(约900条, 含广告+隐私跟踪+流氓推广) -> 🆎 AdBlock
;  原 AdRules(18万行)+anti-AD(10万行) 会撑爆 iOS 50MB 内存上限导致开启即断连，仅桌面端 ini 保留
;本 ini 仅提供策略组定义与 GEOIP/FINAL 兕底
;内存提示：iOS 网络扩展限制约 50MB，若 Stash 仍被杀，优先删减底包中部分 classical provider
;GitHub 加速前缀 ghfast.top 失效时，全局替换为 https://ghproxy.net/ 或 https://gh-proxy.com/

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

;设置规则标志位
;全部分流规则已迁移为底包中的 rule-providers（启动解析峰值大降、规则每日自动更新、更新订阅更快）
;此处仅保留无法用 rule-provider 表达的两条兜底规则
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL
