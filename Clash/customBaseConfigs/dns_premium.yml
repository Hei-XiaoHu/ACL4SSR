# =============================================================================
# Clash Premium 兼容版 DNS 基础配置
# -----------------------------------------------------------------------------
# 适用内核：Clash Premium（Dreamacro 闭源核 / Clash for Windows / ClashX 内置核）
#           同时也可在 Clash Meta(mihomo) 上正常加载运行（向后兼容）
# 对照文件：dns_enhanced.yml（Meta 满血版，仅 Meta 可用）
#
# 与 Meta 版的差异 —— 下列能力 Premium 内核不支持，已用 Premium 等价机制替代或移除：
#   · respect-rules / proxy-server-nameserver / direct-nameserver(-follow-policy)
#       → 改用 fallback + fallback-filter(geoip:CN) 的「国内外分流 + 防污染」机制
#   · nameserver 内的 #策略组 后缀 与 ECS 参数(ecs= / ecs-override=)   → 已移除
#   · prefer-h3 / cache-algorithm                                       → 已移除
#   · nameserver-policy 的 geosite:cn                                   → 由 geoip 分流自动覆盖
# =============================================================================

# HTTP 代理端口
port: 7890

# SOCKS5 代理端口
socks-port: 7891

# Linux 和 macOS 的 redir 代理端口 (如需使用此功能，请取消注释)
# redir-port: 7892
bind-address: "*"

# 允许局域网的连接（可用来共享代理）
allow-lan: true

# 规则模式：Rule（规则） / Global（全局代理）/ Direct（全局直连）
mode: rule

# 日志输出级别：silent / info / warning / error / debug
log-level: info

# clash 的 RESTful API
external-controller: 127.0.0.1:9090

# external-ui: folder
# secret: ""

# DNS 设置
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  use-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"

  # 用于解析下方各 DoH 服务器「自身的域名」，必须是纯 IP（不能是 https:// 形式）
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.2.4.8

  # 主 DNS：国内 DoH —— 负责解析国内域名（速度快、结果准）
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  # 防污染 DNS：国外 DoH —— 配合下方 fallback-filter 使用
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://8.8.4.4/dns-query
    - https://9.9.9.9/dns-query
    - https://208.67.222.222/dns-query
    - https://77.88.8.8/dns-query

  # 分流判定：当 nameserver 的解析结果不属于 CN（或命中下列 ipcidr / domain）时，
  # 改用 fallback 的结果。效果等同「国内域名走国内 DNS，国外域名走防污染 DNS」，
  # 用以替代 Meta 版的 respect-rules / direct-nameserver。
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
      - "+.twitter.com"
      - "+.github.com"
      - "+.githubusercontent.com"

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  extra-direct:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/Hei-XiaoHu/ACL4SSR/master/Clash/rule/extra-direct.txt"
    path: ./ruleset/extra-direct.yaml
    interval: 86400

rules:
  - RULE-SET,reject,🛑 广告拦截
  - RULE-SET,extra-direct,🎯 全球直连
