  game-proxy: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./ruleset/acl4ssr-full/game-proxy.mrs, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/game-proxy.mrs'}
  bilibili: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./ruleset/acl4ssr-full/bilibili.mrs, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/bilibili.mrs'}
  apple: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./ruleset/acl4ssr-full/apple.mrs, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/apple.mrs'}
  direct: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./ruleset/acl4ssr-full/direct.mrs, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/direct.mrs'}
  proxy: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./ruleset/acl4ssr-full/proxy.mrs, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/proxy.mrs'}
  proxy-ip: {type: http, behavior: ipcidr, format: mrs, interval: 86400, path: ./ruleset/acl4ssr-full/proxy-ip.mrs, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/proxy-ip.mrs'}
