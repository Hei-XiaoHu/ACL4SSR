# subconverter 底包（Stash 完整版），需配合 ACL4SSR_Online_Full_AdblockPlus_Stash_Full.ini 使用（依赖其中的策略组）
# 本文件由 tools/build.py 从 src/spec.yaml 生成，请勿手改；改规则请改 src/spec.yaml
# MATCH 兜底由 ini 生成，排在本文件 rules 之后
# 规则：与 mihomo 完全一致，直接下载 rules 分支 mihomo/ 目录的 mrs 规则集（含 AdRules + anti-AD 广告、cn、foreign、cn-ip）；
#   不使用 Stash 原生 GEOSITE/GEOIP，无需 GitHub 可达；仅 BT 进程直连规则无法在 Stash 上实现
# 内存：约 36 万条域名规则，iOS 网络扩展上限 50 MB；导入后在 Stash 首页观察内存读数，接近上限或被系统杀掉请换回标准版
# DNS：follow-rule + DoH 端点 IP 绑定 🛰️ DNS；内网系统 DNS，cn 与直连集合走国内 DoH，其余境外 DoH；节点域名用 proxy-server-nameserver（国内）
# 需 Stash iOS 3.6+ / macOS 4.3+（mrs 规则集、DNS policy 的 rule-set:、proxy-server-nameserver）
# 规则 CDN 为 https://fastly.jsdelivr.net/gh，失效时全局替换为 https://cdn.jsdelivr.net/gh

mode: rule
log-level: warning
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  follow-rule: true
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localdomain
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.ts.net
  - +.tplinkwifi.net
  - +.tendawifi.com
  - +.router.ctc
  - asusrouter.com
  - router.asus.com
  - routerlogin.com
  - tplogin.cn
  - miwifi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - '*.n.n.srv.nintendo.net'
  - +.stun.playstation.net
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
    rule-set:private:
    - system
    +.lan:
    - system
    +.local:
    - system
    +.localdomain:
    - system
    +.localhost:
    - system
    +.home.arpa:
    - system
    +.internal:
    - system
    +.ts.net:
    - system
    +.tplinkwifi.net:
    - system
    +.tendawifi.com:
    - system
    +.router.ctc:
    - system
    asusrouter.com:
    - system
    router.asus.com:
    - system
    routerlogin.com:
    - system
    tplogin.cn:
    - system
    miwifi.com:
    - system
    localhost.ptlogin2.qq.com:
    - system
    localhost.sec.qq.com:
    - system
    localhost.work.weixin.qq.com:
    - system
    rule-set:direct:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    rule-set:cn:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

rule-providers:
  local-direct: {type: http, behavior: classical, format: yaml, interval: 86400, path: ./ruleset/acl4ssr-full/local-direct.yaml, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/local-direct.yaml'}
  private: {type: http, behavior: domain, format: mrs, interval: 86400, path: ./ruleset/acl4ssr-full/private.mrs, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/private.mrs'}
  private-ip: {type: http, behavior: ipcidr, format: mrs, interval: 86400, path: ./ruleset/acl4ssr-full/private-ip.mrs, url: 'https://fastly.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@rules/mihomo/private-ip.mrs'}
