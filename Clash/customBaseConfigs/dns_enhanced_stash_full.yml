rules:
- IP-CIDR,1.1.1.1/32,🛰️ DNS,no-resolve
- IP-CIDR,8.8.8.8/32,🛰️ DNS,no-resolve
- RULE-SET,local-direct,🎯 直连
- RULE-SET,private,DIRECT
- RULE-SET,private-ip,DIRECT,no-resolve
- RULE-SET,telemetry,🛑 广告
- AND,((NETWORK,udp),(PROTOCOL,QUIC),(OR,((RULE-SET,ai),(RULE-SET,auth),(RULE-SET,proxy),(RULE-SET,media),(RULE-SET,foreign),(RULE-SET,ai-ip,no-resolve))),(NOT,((AND,((RULE-SET,cn),(NOT,((RULE-SET,foreign))))))),(NOT,((RULE-SET,cn-ip,no-resolve))),(NOT,((OR,((RULE-SET,quic-exempt),(RULE-SET,direct),(RULE-SET,bilibili),(RULE-SET,microsoft),(RULE-SET,apple),(RULE-SET,games),(RULE-SET,game-proxy)))))),REJECT
- RULE-SET,ai-essential,🤖 AI
- RULE-SET,auth,🚀 节点选择
- RULE-SET,ads,🛑 广告
- RULE-SET,ai,🤖 AI
- RULE-SET,ai-ip,🤖 AI,no-resolve
- RULE-SET,game-proxy,🎮 游戏
- RULE-SET,bilibili,📺 B站
- RULE-SET,apple,🍎 苹果
- RULE-SET,direct,🎯 直连
- RULE-SET,proxy,🚀 节点选择
- RULE-SET,proxy-ip,🚀 节点选择,no-resolve
- RULE-SET,microsoft,Ⓜ️ 微软
- RULE-SET,games,🎮 游戏
- RULE-SET,media,🎬 流媒体
- RULE-SET,media-ip,🎬 流媒体,no-resolve
- RULE-SET,google,🔍 谷歌
- RULE-SET,foreign,🚀 节点选择
- RULE-SET,cn,🎯 直连
- RULE-SET,cn-ip,🎯 直连
