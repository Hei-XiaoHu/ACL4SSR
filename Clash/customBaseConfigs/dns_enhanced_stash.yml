# subconverter 底包（Stash），需配合 ACL4SSR_Online_Full_AdblockPlus_Stash.ini 使用（依赖其中的策略组）
# 本文件由 tools/build.py 从 src/spec.yaml 生成，请勿手改；改规则请改 src/spec.yaml
# MATCH 兜底由 ini 生成，排在本文件 rules 之后
# 规则：本仓库 rules 分支的 domain/ipcidr yaml；国内外兜底复用 Stash 原生 GEOSITE + GEOIP,CN
#   （不额外下载全量 cn/geolocation-!cn 文本）
# 去广告：AWAvenue 秋风规则（约 900 条，含广告+隐私跟踪+流氓推广）
# DNS：follow-rule + DoH 端点 IP 绑定 🛰️ DNS；内网系统 DNS，已知国内与游戏下载走国内 DoH，其余境外 DoH
# geosite DNS policy 需 Stash iOS 3.4.0+；GEOSITE 数据首次从 GitHub 按需加载，请确保 GitHub 可达
# 规则 CDN 为 https://fastly.jsdelivr.net/gh，失效时全局替换为 https://cdn.jsdelivr.net/gh

mode: rule
log-level: warning
ipv6: false
profile:
  store-selected: true
  store-fake-ip: true

