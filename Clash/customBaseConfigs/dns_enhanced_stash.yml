rules:
- IP-CIDR,1.1.1.1/32,🛰️ DNS-Proxy,no-resolve
- IP-CIDR,8.8.8.8/32,🛰️ DNS-Proxy,no-resolve
- RULE-SET,extra-direct,🎯 全球直连
- RULE-SET,private,🎯 全球直连
- RULE-SET,private-ip,🎯 全球直连,no-resolve
- RULE-SET,unban,🎯 全球直连
- RULE-SET,awavenue,🛑 广告拦截
- AND,((NETWORK,udp),(DST-PORT,443),(NOT,((RULE-SET,cn)))),REJECT
- RULE-SET,extra-ai,💬 Ai平台
- RULE-SET,ai,💬 Ai平台
- RULE-SET,googlefcm,📢 谷歌FCM
