# mihomo 底包（DNS 增强 + 去广告）：
# GitHub 规则集经 ghfast.top 加速；若失效，全局替换前缀为 https://ghproxy.net/ 或 https://gh-proxy.com/
# EasyList / EasyListChina / EasyPrivacy 三个 classical 大列表（8.6 万条内联规则，内存大户）
# 改由 domain 格式 rule-provider 提供（AdRules + anti-AD，压缩前缀树存储，内存降低一个数量级）
# 需配合 ACL4SSR_Online_Full_AdblockPlus.ini 使用（依赖其中的策略组）

# HTTP 代理端口
port: 7890

# SOCKS5 代理端口
socks-port: 7891

# Linux 和 macOS 的 redir 代理端口 (如需使用此功能，请取消注释)
# redir-port: 7892
bind-address: "*"

# 允许局域网的连接（可用来共享代理）
allow-lan: true

# 规则模式：Rule（规则） / Global（全局代理）/ Direct（全局直连）
mode: rule

# TCP 并发：对域名的多个 IP 并发握手，取最快建立的连接
tcp-concurrent: true

# 统一延迟：扣除握手等额外耗时，使各协议节点延迟可横向对比
unified-delay: true

# 设置日志输出级别 (默认级别：silent，即不输出任何内容，以避免因日志内容过大而导致程序内存溢出）。
# 5 个级别：silent / info / warning / error / debug。级别越高日志输出量越大，越倾向于调试，若需要请自行开启。
log-level: info

# clash 的 RESTful API
external-controller: 127.0.0.1:9090

# 您可以将静态网页资源（如 clash-dashboard）放置在一个目录中，clash 将会服务于 `${API}/ui`
# 参数应填写配置目录的相对路径或绝对路径。
# external-ui: folder

# RESTful API 的口令 (可选)
# secret: ""

# 持久化策略组选择；Fake-IP 映射不持久化（移动端写盘开销大，且旧映射易与 fake-ip-filter 冲突）
profile:
  store-selected: true
  store-fake-ip: false

# DNS 设置
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.home.arpa"
    - "+.internal"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"

  default-nameserver:
    - 223.5.5.5
    - 1.2.4.8
    - 119.29.29.29

  # 多路 DoH 并发竞速，取最先返回者；全部使用 IP 形式，免去先解析 DoH 域名的额外一跳
  nameserver:
    - "https://1.1.1.1/dns-query#DNS-Proxy"
    - "https://8.8.8.8/dns-query#DNS-Proxy"
    - "https://9.9.9.9/dns-query#DNS-Proxy"
    - "https://208.67.222.222/dns-query#DNS-Proxy"
    - "https://77.88.8.8/dns-query#DNS-Proxy"

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query

  direct-nameserver-follow-policy: false

  nameserver-policy:
    "geosite:cn":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query

# 全部分流规则改由 rule-provider 提供：
#   主配置从几千行缩到几百行，启动解析峰值大降；规则每日自动更新，独立于订阅
#   顺序与 ACL4SSR 原版一致（UnBan 先于广告拦截）；GEOIP,CN / FINAL 由 ini 生成，排在本列表之后
rule-providers:
  extra-direct: {type: http, behavior: classical, format: yaml, interval: 86400, path: ./ruleset/extra-direct.yaml, url: "https://ghfast.top/https://raw.githubusercontent.com/Hei-XiaoHu/ACL4SSR/master/Clash/rule/extra-direct.txt"}
  lan: {type: http, behavior: classical, format: text, interval: 86400, path: ./ruleset/lan.list, url: "https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list"}
  unban: {type: http, behavior: classical, format: text, interval: 86400, path: ./ruleset/unban.list, url: "https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list"}
  banad: {type: http, behavior: classical, format: text, interval: 86400, path: ./ruleset/banad.list, url: "https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list"}
  banprogramad: {type: http, behavior: classical, format: text, interval: 86400, path: ./ruleset/banprogramad.list, url: "https://ghfast.top/https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list"}
  # AdRules：上游合并 EasyList / EasyListChina / EasyPrivacy 等，18 万+ 域名，domain 前缀树仅占几 MB
  adrules: {type: http, behavior: domain, format: text, interval: 86400, path: ./ruleset/adrules.txt, url: "https://adrules.top/adrules_domainset.txt"}
