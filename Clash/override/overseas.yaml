# Clash Party 远程覆写 · 国外模式（仅海外电脑）
# 本文件由 tools/build.py 从 src/spec.yaml 生成，请勿手改；改规则请改 src/spec.yaml
# 效果：分流规则与策略组完全不变；DNS 中所有国内服务器换成 Cloudflare / Google 的 DoH + DoT
#   主 DNS 仍经 🛰️ DNS-Proxy 组发出（想更快可在面板把该组切到 DIRECT）；内网仍走 system
# 用法：Clash Party → 覆写 → 导入远程链接：
#   https://testingcf.jsdelivr.net/gh/Hei-XiaoHu/ACL4SSR@master/Clash/override/overseas.yaml
#   然后在订阅的「编辑信息」里勾选此覆写
# 前提：设置里关闭「控制 DNS 设置」，否则软件自身 DNS 设置优先级更高，本文件的 dns! 不生效
# dns! 强制整段替换

dns!:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  direct-nameserver-follow-policy: true
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localdomain
  - +.localhost
  - +.home.arpa
  - +.internal
  - +.ts.net
  - +.tplinkwifi.net
  - +.tendawifi.com
  - +.router.ctc
  - asusrouter.com
  - router.asus.com
  - routerlogin.com
  - tplogin.cn
  - miwifi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - ntp.*.com
  - +.ntp.org
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - '*.n.n.srv.nintendo.net'
  - +.stun.playstation.net
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - https://1.1.1.1/dns-query#🛰️ DNS-Proxy
  - https://8.8.8.8/dns-query#🛰️ DNS-Proxy
  - tls://1.1.1.1#🛰️ DNS-Proxy
  - tls://8.8.8.8#🛰️ DNS-Proxy
  proxy-server-nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  - tls://1.1.1.1
  - tls://8.8.8.8
  direct-nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  - tls://1.1.1.1
  - tls://8.8.8.8
  nameserver-policy:
    rule-set:private:
    - system
    +.lan:
    - system
    +.local:
    - system
    +.localdomain:
    - system
    +.localhost:
    - system
    +.home.arpa:
    - system
    +.internal:
    - system
    +.ts.net:
    - system
    +.tplinkwifi.net:
    - system
    +.tendawifi.com:
    - system
    +.router.ctc:
    - system
    asusrouter.com:
    - system
    router.asus.com:
    - system
    routerlogin.com:
    - system
    tplogin.cn:
    - system
    miwifi.com:
    - system
    localhost.ptlogin2.qq.com:
    - system
    localhost.sec.qq.com:
    - system
    localhost.work.weixin.qq.com:
    - system
